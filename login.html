<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/estilo.css">
    <link rel="stylesheet" href="estilos/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body onresize="resize()">
    <header>
        <h1>Login</h1>
    </header>
    <span id="burger" class="material-symbols-outlined" onclick="clicked()">menu</span>
    <nav id="itens">
        <a href="main.html">Voltar a página inicial</a>
    </nav>
    <main>
        <small>Home > <strong>Login</strong></small>

        <article id="login">
            <div id="imagem">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Para acessar a área reservada preencha os dados abaixo</p>

                <form action="cadastro.php" method="post">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="text" name="user" id="iuser" required minlength="5" maxlength="10">
                        <label for="iuser">Usuário: </label>
                    </div>
                    <div class="campo">
                        <span class="material-symbols-outlined">key</span>
                        <input type="password" name="pass" id="ipass" required minlength="5" maxlength="10">
                        <label for="ipass">Senha: </label>
                    </div>
                    <div class="botoes">
                        <input type="submit" value="Enviar" onclick="password()">
                        <input type="reset" value="Limpar">
                    </div>
                </form>
            </div>
        </article>

    </main>
    <footer></footer>
    
    <script src="script.js"></script>
</body>

</html>
